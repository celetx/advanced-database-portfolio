# Only for this isolated container with no network and no published ports.
# Production requires SCRAM/TLS, role controls and private networking (see CloudDeployment.md).
local all all trust
host replication portfolio_replicator 127.0.0.1/32 trust
host all postgres 127.0.0.1/32 trust
host all all 0.0.0.0/0 reject
host all all ::0/0 reject
