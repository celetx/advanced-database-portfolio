# Teaching-only configuration; actual ports/socket paths are supplied by the runner.
listen_addresses = '127.0.0.1'
wal_level = replica
max_wal_senders = 4
max_replication_slots = 4
wal_keep_size = '64MB'
max_slot_wal_keep_size = '128MB'
hot_standby = on
synchronous_commit = on
# No synchronous_standby_names: replication is asynchronous.
fsync = on
full_page_writes = on
shared_buffers = '64MB'
max_connections = 30
